services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # The index and uploaded documents live outside the container, so they
      # survive restarts and rebuilds.
      - ./data:/app/data
      # Documents to index, mounted read-only: `POST /ingest {"directory": "corpus"}`
      - ./corpus:/app/corpus:ro
    # Secrets are injected at run time, never copied into the image.
    env_file: .env
    restart: unless-stopped
