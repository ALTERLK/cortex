[project]
name = "cortex"
version = "1.0.0"
description = "Agentic RAG knowledge assistant: ask questions over your own documents, get answers with citations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic-settings>=2.7",
    "pypdf>=4.0",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.27.2",
    "jieba>=0.42.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.15.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (likely bugs)
]
ignore = [
    "E402",  # module-level import not at top — intentional in scripts (UTF-8 stdout fix first)
]
