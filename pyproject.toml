[project]
name = "cortex"
version = "0.1.0"
description = "Agentic RAG knowledge assistant: ask questions over your own documents, get answers with citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic-settings>=2.7",
    "pypdf>=4.0",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
