<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cortex Evaluation</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='3.2' fill='%232a63f6'/%3E%3Ccircle cx='12' cy='12' r='7.5' fill='none' stroke='%232a63f6' stroke-width='1.6' opacity='.6'/%3E%3C/svg%3E">
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem("cortex.theme"));
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) { /* no saved preference: follow the system */ }
  </script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/eval.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main eval-main">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" type="button" aria-label="Menu"></button>
        <span class="brand-name">Cortex</span>
      </header>
      <div class="eval" id="eval"></div>
    </main>

    <div class="scrim" id="scrim"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/static/js/eval.js"></script>
</body>
</html>
