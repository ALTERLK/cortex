<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cortex</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='3.2' fill='%232a63f6'/%3E%3Ccircle cx='12' cy='12' r='7.5' fill='none' stroke='%232a63f6' stroke-width='1.6' opacity='.6'/%3E%3C/svg%3E">
  <!-- Apply a saved theme before the first paint, so the page never flashes the other one. -->
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem("cortex.theme"));
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) { /* no saved preference: follow the system */ }
  </script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/chat.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" type="button" aria-label="Menu"></button>
        <span class="brand-name">Cortex</span>
        <button class="icon-btn" id="inspector-btn" type="button" aria-label="Evidence" style="margin-left: auto"></button>
      </header>

      <section class="chat" id="chat" aria-live="polite"></section>

      <footer class="composer-wrap">
        <div class="col">
          <form class="composer" id="composer">
            <textarea id="question" rows="1" maxlength="2000" autocomplete="off"
                      data-i18n-placeholder="composer.placeholder"></textarea>
            <div class="composer-row">
              <div class="segmented" role="radiogroup" aria-label="Answer mode">
                <button type="button" role="radio" data-mode="auto" data-i18n="mode.auto"></button>
                <button type="button" role="radio" data-mode="rag" data-i18n="mode.rag"></button>
                <button type="button" role="radio" data-mode="agent" data-i18n="mode.agent"></button>
              </div>
              <span class="mode-hint" id="mode-hint"></span>
              <button id="send" type="submit"></button>
            </div>
          </form>
        </div>
      </footer>
    </main>

    <aside class="inspector" id="inspector" hidden></aside>
    <div class="scrim" id="scrim"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
